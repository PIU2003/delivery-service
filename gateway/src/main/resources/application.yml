spring:
  application:
    name: gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: parcel-service
          uri: ${PARCEL_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/parcels/**
        - id: courier-service
          uri: ${COURIER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/couriers/**
        - id: delivery-service
          uri: ${DELIVERY_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/deliveries/**
        - id: auth-service
          uri: ${AUTH_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/auth/**

server:
  port: ${SERVER_PORT:8080}

# API keys injected by gateway in Phase 4 (documented here for conventions)
app:
  api-key-header: X-API-KEY
  downstream-keys:
    parcel: ${PARCEL_API_KEY:parcel-service-key}
    courier: ${COURIER_API_KEY:courier-service-key}
    delivery: ${DELIVERY_API_KEY:delivery-service-key}
    auth: ${AUTH_API_KEY:auth-service-key}

management:
  endpoints:
    web:
      exposure:
        include: health,info
