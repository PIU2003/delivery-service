spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/authdb
    username: ${MYSQL_USER:courier}
    password: ${MYSQL_PASSWORD:courier}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: ${SERVER_PORT:8084}

app:
  api-key: ${API_KEY:auth-service-key}
  api-key-header: X-API-KEY
  jwt:
    secret: ${JWT_SECRET:change-me-parcel-delivery-jwt-secret-key-32b}
    issuer: ${JWT_ISSUER:parcel-delivery-auth}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  seed:
    username: ${AUTH_SEED_USERNAME:admin}
    password: ${AUTH_SEED_PASSWORD:password}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
