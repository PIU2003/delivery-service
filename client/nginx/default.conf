server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Health-friendly root for compose healthcheck
    location = /health {
        default_type text/plain;
        return 200 'ok';
    }
}
