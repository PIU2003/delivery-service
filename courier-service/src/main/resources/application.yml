spring:
  application:
    name: courier-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/courierdb
    username: ${MYSQL_USER:courier}
    password: ${MYSQL_PASSWORD:courier}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8082}

app:
  api-key: ${API_KEY:courier-service-key}
  api-key-header: X-API-KEY
  rabbitmq:
    exchange: delivery.exchange
    queue: courier.availability.queue
    routing-keys:
      assigned: parcel.assigned
      delivered: parcel.delivered

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
