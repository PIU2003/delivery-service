spring:
  application:
    name: delivery-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/deliverydb
    username: ${MYSQL_USER:courier}
    password: ${MYSQL_PASSWORD:courier}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

server:
  port: ${SERVER_PORT:8083}

# Shared messaging contract (see CONVENTIONS.md)
app:
  api-key: ${API_KEY:delivery-service-key}
  api-key-header: X-API-KEY
  rabbitmq:
    exchange: delivery.exchange
    routing-keys:
      assigned: parcel.assigned
      pickedup: parcel.pickedup
      delivered: parcel.delivered
  courier-service:
    base-url: ${COURIER_SERVICE_URL:http://localhost:8082}
    api-key: ${COURIER_API_KEY:courier-service-key}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
